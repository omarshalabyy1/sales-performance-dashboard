<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 707" width="1000" height="707" role="img" aria-label="Star schema: fact_sales (110,197 rows, one per order item, key order_id plus item_no) joins four dimensions, many to one, each filtering one way into the fact: dim_date (1,096 days, built in DAX) on order_date, dim_product (32,951 rows) on product_id, dim_seller (3,095 rows) on seller_id and dim_customer (99,441 rows) on customer_id. report_settings (1 row, the top-N values) and _Measures (23 measures) stand apart. Row-level security filters dim_seller by region.">
