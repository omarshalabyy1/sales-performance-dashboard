<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 744" width="1000" height="744" role="img" aria-label="The star schema, the Semantic layer: fact_sales (110,197 rows, one per order item, key order_id plus item_no) joins four dimensions, many to one, each filtering one way into the fact: dim_date (1,096 days, built in DAX) on order_date, dim_product (32,951 rows) on product_id, dim_seller (3,095 rows) on seller_id and dim_customer (99,441 rows) on customer_id. The Gold layer's rule results are plain columns: delivery_status, review_score, seller_region and customer_region. report_settings (1 row, the top-N values) stands apart. Analytical layer: _Measures holds the 23 measures in 6 display folders. 5 security roles filter dim_seller by region.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748B"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
