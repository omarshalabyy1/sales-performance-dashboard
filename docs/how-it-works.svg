<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>How it works: load, clean, model, measure, report, secure</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="330" rx="14" fill="#FFFFFF"/>

  <!-- Row 1 -->
  <g>
    <rect x="15" y="20" width="270" height="120" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <circle cx="43" cy="50" r="16" fill="#2563EB"/>
    <text x="43" y="56" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">1</text>
    <text x="69" y="57" font-size="19" font-weight="700" fill="#0E1630">Load</text>
    <text x="30" y="92" font-size="14" fill="#475569">Orders, items, products, sellers,</text>
    <text x="30" y="114" font-size="14" fill="#475569">customers, reviews, category names</text>
  </g>
  <g>
    <rect x="315" y="20" width="270" height="120" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <circle cx="343" cy="50" r="16" fill="#2563EB"/>
    <text x="343" y="56" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">2</text>
    <text x="369" y="57" font-size="19" font-weight="700" fill="#0E1630">Clean</text>
    <text x="330" y="92" font-size="14" fill="#475569">Delivered orders, dates only,</text>
    <text x="330" y="114" font-size="14" fill="#475569">the latest review of each order</text>
  </g>
  <g>
    <rect x="615" y="20" width="270" height="120" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <circle cx="643" cy="50" r="16" fill="#2563EB"/>
    <text x="643" y="56" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">3</text>
    <text x="669" y="57" font-size="19" font-weight="700" fill="#0E1630">Model</text>
    <text x="630" y="92" font-size="14" fill="#475569">One fact table of items sold,</text>
    <text x="630" y="114" font-size="14" fill="#475569">four dimensions, one-way filters</text>
  </g>

  <line x1="287" y1="80" x2="311" y2="80" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="587" y1="80" x2="611" y2="80" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M750,142 V165 H150 V186" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 2 -->
  <g>
    <rect x="15" y="190" width="270" height="120" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <circle cx="43" cy="220" r="16" fill="#2563EB"/>
    <text x="43" y="226" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">4</text>
    <text x="69" y="227" font-size="19" font-weight="700" fill="#0E1630">Measure</text>
    <text x="30" y="262" font-size="14" fill="#475569">23 DAX measures: revenue, growth,</text>
    <text x="30" y="284" font-size="14" fill="#475569">late deliveries, reviews, sellers</text>
  </g>
  <g>
    <rect x="315" y="190" width="270" height="120" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <circle cx="343" cy="220" r="16" fill="#2563EB"/>
    <text x="343" y="226" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">5</text>
    <text x="369" y="227" font-size="19" font-weight="700" fill="#0E1630">Report</text>
    <text x="330" y="262" font-size="14" fill="#475569">Five pages: overview, sales,</text>
    <text x="330" y="284" font-size="14" fill="#475569">categories, sellers, delivery</text>
  </g>
  <g>
    <rect x="615" y="190" width="270" height="120" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <circle cx="643" cy="220" r="16" fill="#2563EB"/>
    <text x="643" y="226" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">6</text>
    <text x="669" y="227" font-size="19" font-weight="700" fill="#0E1630">Secure</text>
    <text x="630" y="262" font-size="14" fill="#475569">Five region roles: each manager</text>
    <text x="630" y="284" font-size="14" fill="#475569">sees only their own sellers</text>
  </g>

  <line x1="287" y1="250" x2="311" y2="250" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="587" y1="250" x2="611" y2="250" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
