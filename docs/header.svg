<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240" role="img" aria-label="Sales performance dashboard. 96,478 orders: orders that arrived late scored 2.27 stars against 4.29 on time, and the top 10% of sellers brought 67% of revenue. Bars show the average review, late against on time.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#10213A"/>
      <stop offset="1" stop-color="#0E1630"/>
    </linearGradient>
      <radialGradient id="jrGlowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="jrGlowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#14B8A6" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    text { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
    .eyebrow { font-size: 13px; font-weight: 600; fill: #60A5FA; letter-spacing: 1.5px; }
    .title { font-size: 30px; font-weight: 700; fill: #FFFFFF; }
    .result { font-size: 15px; fill: #CBD5E1; }
    .chip { font-size: 13px; font-weight: 600; fill: #FFFFFF; }
    .cap { font-size: 11.5px; fill: #94A3B8; }
    .val { font-size: 15px; font-weight: 700; fill: #FFFFFF; }
      .wave { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 2 10; animation: flow 6s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -120; } }
  </style>

  <rect width="1000" height="240" rx="22" fill="url(#bg)"/>
  <circle cx="880" cy="60" r="190" fill="url(#jrGlowA)"/>
  <circle cx="160" cy="220" r="170" fill="url(#jrGlowB)"/>
  <path class="wave" stroke="#2DD4BF" stroke-opacity="0.5" d="M24 229 C 200 224, 330 233, 500 229 S 800 225, 976 229"/>
  <path class="wave" stroke="#A78BFA" stroke-opacity="0.4" style="animation-duration:9s" d="M40 235 C 220 231, 360 238, 520 235 S 820 232, 960 235"/>

  <text x="50" y="62" class="eyebrow">PROJECT · SALES DASHBOARD</text>
  <text x="50" y="104" class="title">Sales performance dashboard</text>
  <text x="50" y="136" class="result">96,478 orders: orders that arrived late scored 2.27 stars against 4.29 on time,</text>
  <text x="50" y="157" class="result">and the top 10% of sellers brought 67% of revenue.</text>

  <rect x="50" y="180" width="150" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.08"/>
  <text x="125" y="200" class="chip" text-anchor="middle">96,478 orders</text>
  <rect x="210" y="180" width="150" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.08"/>
  <text x="285" y="200" class="chip" text-anchor="middle">2018 revenue +145.1%</text>
  <rect x="370" y="180" width="150" height="30" rx="15" fill="#3B82F6" fill-opacity="0.25"/>
  <text x="445" y="200" class="chip" text-anchor="middle">6.8% arrive late</text>

  <text x="780" y="62" class="cap">Average review, out of 5 stars</text>
  <rect x="800" y="146.1" width="50" height="49.9" rx="4" fill="#3B82F6"/>
  <text x="825" y="138" class="val" text-anchor="middle">2.27</text>
  <rect x="880" y="101.6" width="50" height="94.4" rx="4" fill="#E2E8F0"/>
  <text x="905" y="93" class="val" text-anchor="middle">4.29</text>
  <line x1="780" y1="196" x2="950" y2="196" stroke="#94A3B8" stroke-width="1"/>
  <text x="825" y="214" class="cap" text-anchor="middle">late</text>
  <text x="905" y="214" class="cap" text-anchor="middle">on time</text>
</svg>
