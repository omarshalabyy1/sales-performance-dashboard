<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 615" width="1000" height="615" role="img" aria-label="Data flow, table by table, left to right through six layers. Input and Bronze layer: eight CSV files as received, orders 99,441 rows, reviews 99,224, items 112,650, regions 27, products 32,951, category names 71, sellers 3,095, customers 99,441. Silver layer: the same rows with the mapped columns, typed, keys and links checked. Gold layer: sale_orders, the 96,478 delivered orders with the late rule; latest_review, one per order (98,673); REGION_OF, 27 states to their region. Semantic layer: fact_sales (110,197 rows) from items, sale orders and latest reviews; dim_product (32,951), dim_seller (3,095) and dim_customer (99,441) from the Silver tables and the region map; report_settings (1 row) from the config; dim_date (1,096 days) in DAX. Analytical layer: 23 DAX measures and the notebook's numbers. Reporting layer: five Power BI pages with 5 region roles, and three README charts. sql/checks.sql, not a layer, recomputes the main totals from the input files.">
