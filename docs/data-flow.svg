<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 644.2" width="1000" height="644.2" role="img" aria-label="Data flow, table by table: eight input files load into the notebook (orders 99,441 rows, items 112,650, reviews 99,224, products 32,951, category names 71, sellers 3,095, customers 99,441, regions 27). The rules keep the 96,478 delivered orders, each order's latest review and each state's region. The notebook writes fact_sales (110,197 rows), dim_product (32,951), dim_seller (3,095), dim_customer (99,441) and report_settings (1 row) to output/. Power BI adds dim_date (1,096 days) in DAX and shows five pages: Overview, Sales, Categories, Sellers and Delivery. sql/checks.sql recomputes the main totals in DuckDB from the input files.">
